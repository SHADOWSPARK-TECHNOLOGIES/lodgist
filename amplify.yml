version: 1
applications:
  - appRoot: lodgist
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@latest --activate
            - pnpm install --no-frozen-lockfile
            - cd ../packages/db && pnpm install --no-frozen-lockfile && npx prisma generate
        build:
          commands:
            - cd $CODEBUILD_SRC_DIR/lodgist
            - NODE_OPTIONS=--max-old-space-size=4096 pnpm build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
          - ../packages/db/node_modules/**/*
