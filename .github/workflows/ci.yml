name: Lodgist CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}
  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
  NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir packages/db install --frozen-lockfile
          pnpm --dir lodgist install --frozen-lockfile

      - name: Generate Prisma client
        run: cd lodgist && npx prisma generate

      - name: TypeScript check
        run: cd lodgist && npx tsc --noEmit

      - name: Run tests
        run: cd lodgist && npx vitest run

      - name: Build
        run: cd lodgist && npx next build

  deploy:
    name: Deploy to Vercel
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel Production
        run: cd lodgist && npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
