name: Lodgist CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}
  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
  # Blank repository secrets become "" and NextAuth calls new URL(""), which crashes prerender.
  NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'http://localhost:3000' }}

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: packages/db/pnpm-lock.yaml

      - name: Install database package
        working-directory: packages/db
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/db
        run: pnpm exec prisma generate --config prisma.config.ts

      - name: Install Lodgist app
        working-directory: lodgist
        run: npm ci

      - name: TypeScript check
        working-directory: lodgist
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: lodgist
        run: npx vitest run

      - name: Build
        working-directory: lodgist
        run: npx next build

  deploy:
    name: Deploy to Vercel
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel Production
        run: cd lodgist && npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
