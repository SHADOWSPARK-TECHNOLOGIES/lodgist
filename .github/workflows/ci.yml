name: Lodgist CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

# Only superseded PR checks are cancelled; every main/dev push still runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}
  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
  # Blank repository secrets become "" and NextAuth calls new URL(""), which crashes prerender.
  NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'http://localhost:3000' }}

jobs:
  ci:
    name: Build & Test
    runs-on: [self-hosted, linux, x64, lodgist-ci]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            packages/db/pnpm-lock.yaml
            lodgist/pnpm-lock.yaml

      - name: Check root lockfile (used by Railway lodgist-api)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install database package
        working-directory: packages/db
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/db
        run: pnpm exec prisma generate --config prisma.config.ts

      - name: Install Lodgist app
        working-directory: lodgist
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: lodgist
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: lodgist
        run: npx vitest run

      - name: Build
        working-directory: lodgist
        run: npx next build

  frontend:
    name: Frontend Build
    runs-on: [self-hosted, linux, x64, lodgist-ci]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: pnpm test
      - run: npx next build

  backend:
    name: Backend Tests
    runs-on: [self-hosted, linux, x64, lodgist-ci]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
