# ─── Deploy Backend (Express API) ──────────────────────────────────────────
# CI/CD pipeline for the Lodgist backend Express API.
# 1. Install dependencies & generate Prisma client
# 2. Run unit + integration tests
# 3. Build Docker image & push to ECR
# 4. Deploy to AWS App Runner (via App Runner service update)

name: Deploy Backend

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "packages/db/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "latest"
  AWS_REGION: us-east-1
  ECR_REPOSITORY: lodgist-backend
  APP_RUNNER_SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN }}

jobs:
  # ── Job 1: Test ────────────────────────────────────────────────────────────
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lodgist
          POSTGRES_PASSWORD: lodgist
          POSTGRES_DB: lodgist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        run: npm ci
        working-directory: ./backend

      - name: Install packages/db dependencies
        run: npm install --legacy-peer-deps
        working-directory: ./packages/db

      - name: Generate Prisma client
        run: npx prisma generate --config prisma.config.ts
        working-directory: ./packages/db
        env:
          DATABASE_URL: postgresql://lodgist:lodgist@localhost:5432/lodgist_test

      - name: Run Prisma migrations (test DB)
        run: npx prisma migrate deploy --config prisma.config.ts
        working-directory: ./packages/db
        env:
          DATABASE_URL: postgresql://lodgist:lodgist@localhost:5432/lodgist_test
          DIRECT_URL: postgresql://lodgist:lodgist@localhost:5432/lodgist_test

      - name: Run tests
        run: npm test
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://lodgist:lodgist@localhost:5432/lodgist_test
          NODE_ENV: test
          JWT_SECRET: test-secret
          PAYSTACK_SECRET_KEY: test-key

  # ── Job 2: Build & Push Docker Image ──────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: echo "tag=${{ github.sha }}-$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker build \
            --build-arg DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest \
            -f backend/Dockerfile .
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          echo "image=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Save image tag for deploy
        run: echo "${{ steps.vars.outputs.tag }}" > image-tag.txt
        if: github.ref == 'refs/heads/main'

      - name: Upload image tag artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image-tag.txt
        if: github.ref == 'refs/heads/main'

  # ── Job 3: Deploy to AWS App Runner ───────────────────────────────────────
  deploy:
    name: Deploy to App Runner
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download image tag
        uses: actions/download-artifact@v4
        with:
          name: image-tag

      - name: Read image tag
        id: image-tag
        run: echo "tag=$(cat image-tag.txt)" >> "$GITHUB_OUTPUT"

      - name: Get ECR registry
        id: ecr
        run: |
          REGISTRY=$(aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --query 'repositories[0].repositoryUri' --output text | cut -d'/' -f1)
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Update App Runner service
        run: |
          aws apprunner update-service \
            --service-arn "${{ env.APP_RUNNER_SERVICE_ARN }}" \
            --source-configuration '{
              "ImageRepository": {
                "ImageIdentifier": "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}",
                "ImageRepositoryType": "ECR",
                "ImageConfiguration": {
                  "Port": "8080"
                }
              }
            }'
